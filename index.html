<html lang="id">

    <style>
        :root {
            --bg-dark: #120428;
            --bg-card: rgba(30, 8, 60, 0.88);
            --accent-yellow: #ffea00;
            --accent-cyan: #00f2fe;
            --accent-pink: #ff007f;
            --text-white: #ffffff;
            --border-glow: rgba(0, 242, 254, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            /* Latar Belakang Gradasi Tema INFLY CARNIVAL */
            background: 
                radial-gradient(circle at 50% 20%, rgba(0, 242, 254, 0.35) 0%, transparent 60%),
                radial-gradient(circle at 50% 50%, rgba(255, 0, 127, 0.25) 0%, transparent 70%),
                linear-gradient(180deg, #00b4db 0%, #0083b0 25%, #7b2cbf 55%, #3c096c 80%, #120428 100%);
            background-attachment: fixed;
            color: var(--text-white);
            padding: 20px;
            min-height: 100vh;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(rgba(255, 234, 0, 0.12) 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            pointer-events: none;
            z-index: 0;
        }

        .container { position: relative; z-index: 1; max-width: 100%; margin: 0 auto; }

        #login-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 2, 25, 0.95); display: flex; justify-content: center; align-items: center; z-index: 9999;
        }

        .modal-box {
            background: var(--bg-card); border: 2px solid var(--accent-yellow); padding: 30px;
            border-radius: 16px; width: 90%; max-width: 400px; text-align: center;
            box-shadow: 0 0 35px rgba(255, 234, 0, 0.5), inset 0 0 15px rgba(255, 0, 127, 0.3);
        }

        .modal-box h2 { color: var(--accent-yellow); margin-bottom: 15px; text-transform: uppercase; letter-spacing: 2px; }
        .modal-box p { color: #e2e8f0; font-size: 0.9rem; margin-bottom: 20px; }

        .modal-btn { width: 100%; padding: 12px; margin: 8px 0; font-weight: bold; border-radius: 8px; cursor: pointer; border: none; font-size: 1rem; transition: 0.2s; }
        .btn-admin { background: linear-gradient(135deg, #ffea00 0%, #ff9100 100%); color: #120428; }
        .btn-admin:hover { transform: scale(1.02); }
        .btn-viewer { background: rgba(0, 242, 254, 0.15); color: var(--accent-cyan); border: 1px solid var(--accent-cyan); }
        .btn-viewer:hover { background: rgba(0, 242, 254, 0.3); }

        .panitia-login-box { display: none; margin-top: 15px; }
        .panitia-login-box input {
            width: 100%; padding: 10px; background: rgba(0,0,0,0.6); border: 1px solid var(--border-glow);
            color: #fff; border-radius: 6px; margin-bottom: 10px; text-align: center;
        }

        .top-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(18, 4, 40, 0.85); padding: 10px 20px; border-radius: 10px; margin-bottom: 20px; border: 1px solid var(--border-glow); }
        .role-badge { font-size: 0.9rem; font-weight: bold; padding: 5px 12px; border-radius: 20px; }
        .badge-admin { background: rgba(255, 234, 0, 0.2); color: var(--accent-yellow); border: 1px solid var(--accent-yellow); }
        .badge-viewer { background: rgba(0, 242, 254, 0.2); color: var(--accent-cyan); border: 1px solid var(--accent-cyan); }

        header {
            text-align: center; margin-bottom: 25px; padding: 22px;
            background: linear-gradient(135deg, rgba(255, 0, 127, 0.4) 0%, rgba(123, 44, 191, 0.8) 50%, rgba(0, 242, 254, 0.4) 100%);
            border: 2px solid var(--accent-yellow); border-radius: 16px;
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.4), 0 0 15px rgba(0, 242, 254, 0.3);
        }
        header h1 {
            color: var(--accent-yellow); font-size: 2.3rem; text-transform: uppercase;
            letter-spacing: 3px; text-shadow: 0 0 18px rgba(255, 234, 0, 0.8); margin-bottom: 5px;
        }
        header p { color: var(--accent-cyan); font-size: 1rem; letter-spacing: 1.5px; font-weight: bold; text-shadow: 0 0 10px rgba(0, 242, 254, 0.6); }

        .main-nav { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; }
        .nav-btn {
            background: rgba(18, 4, 40, 0.85); color: var(--accent-cyan);
            border: 2px solid var(--accent-cyan); padding: 12px 25px; font-size: 1rem;
            font-weight: bold; border-radius: 10px; cursor: pointer; transition: all 0.3s ease;
        }
        .nav-btn.active {
            background: linear-gradient(135deg, #ffea00 0%, #ff007f 100%); color: #ffffff;
            border-color: var(--accent-yellow); box-shadow: 0 0 25px rgba(255, 0, 127, 0.7); transform: translateY(-2px);
        }

        .tab-section { display: none; }
        .tab-section.active { display: block; }

        .team-list-container {
            background: var(--bg-card); border: 1px solid var(--border-glow);
            padding: 25px; border-radius: 16px; max-width: 900px; margin: 0 auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .team-list-container h2 { color: var(--accent-yellow); margin-bottom: 20px; text-align: center; text-transform: uppercase; }

            padding: 8px 20px; border-radius: 8px; cursor: pointer; font-weight: bold;
        }
