<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOURNAMENT MLBB INFLY CARNIVAL</title>

    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

    <style>
        :root {
            --bg-dark: #080312;
            --bg-card: rgba(16, 12, 34, 0.85);
            --bg-input: rgba(6, 4, 18, 0.7);
            --accent-gold: #fbbf24;
            --accent-pink: #ec4899;
            --accent-cyan: #22d3ee;
            --border-subtle: rgba(34, 211, 238, 0.3);
            --border-focus: rgba(236, 72, 153, 0.6);
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --shadow-card: 0 12px 32px rgba(0, 0, 0, 0.6);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        
        body {
            background-color: var(--bg-dark);
            background-image: linear-gradient(180deg, rgba(8, 3, 18, 0.65) 0%, rgba(8, 3, 18, 0.85) 100%), url('logo.jpeg');
            background-repeat: no-repeat;
            background-position: center top;
            background-size: cover;
            background-attachment: fixed;
            color: var(--text-main);
            padding: 16px 12px;
            min-height: 100vh;
        }

        #login-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 2, 12, 0.92);
            backdrop-filter: blur(10px);
            display: flex; justify-content: center; align-items: center;
            z-index: 99999; padding: 15px;
        }
        .modal-box {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            padding: 32px 24px;
            border-radius: 16px; width: 100%; max-width: 360px; text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
        }
        .modal-box h2 { color: var(--accent-gold); margin-bottom: 8px; font-size: 1.25rem; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; text-shadow: 0 0 10px rgba(251, 191, 36, 0.3); }
        .modal-box p { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px; }
        .modal-btn { width: 100%; padding: 11px; margin: 6px 0; font-weight: 600; border-radius: 8px; cursor: pointer; border: none; font-size: 0.9rem; transition: all 0.2s ease; }
        .btn-admin { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #0f172a; }
        .btn-admin:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-viewer { background: rgba(34, 211, 238, 0.1); color: var(--accent-cyan); border: 1px solid var(--border-subtle); }
        .btn-viewer:hover { background: rgba(34, 211, 238, 0.2); }
        .panitia-box { display: none; margin-top: 14px; }
        .panitia-box input { width: 100%; padding: 10px; background: var(--bg-input); border: 1px solid var(--border-subtle); color: #fff; border-radius: 8px; margin-bottom: 8px; text-align: center; font-size: 0.85rem; }

        .container { max-width: 1300px; margin: 0 auto; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; background: var(--bg-card); padding: 10px 16px; border-radius: 12px; margin-bottom: 16px; border: 1px solid var(--border-subtle); backdrop-filter: blur(12px); box-shadow: var(--shadow-card); }
        .role-badge { font-size: 0.8rem; font-weight: 600; padding: 5px 12px; border-radius: 20px; background: rgba(34, 211, 238, 0.12); color: var(--accent-cyan); border: 1px solid var(--border-subtle); }
        
        header { 
            text-align: center; 
            margin-bottom: 20px; 
            padding: 10px; 
        }
        header h1 { color: var(--accent-gold); font-size: 1.4rem; text-transform: uppercase; margin-bottom: 4px; letter-spacing: 0.8px; font-weight: 800; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
        header p { color: var(--accent-cyan); font-size: 0.825rem; font-weight: 700; text-shadow: 0 2px 8px rgba(0,0,0,0.8); }

        .menu-container {
            position: relative;
            margin-bottom: 16px;
        }
        .hamburger-btn {
            background: var(--bg-card);
            color: var(--accent-gold);
            border: 1px solid var(--border-subtle);
            padding: 9px 16px;
            font-size: 0.875rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .hamburger-btn:hover { border-color: var(--accent-pink); color: #fff; }

        .main-nav { 
            display: none; 
            position: absolute;
            top: 44px;
            left: 0;
            background: rgba(12, 8, 28, 0.92);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            padding: 6px;
            flex-direction: column; 
            gap: 4px; 
            min-width: 220px;
            z-index: 999;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            backdrop-filter: blur(16px);
        }
        .main-nav.show { display: flex; }
        .nav-btn { 
            background: transparent; 
            color: var(--text-muted); 
            border: none; 
            padding: 10px 14px; 
            font-size: 0.825rem; 
            font-weight: 600; 
            border-radius: 6px; 
            cursor: pointer; 
            text-align: left;
            transition: all 0.15s ease;
        }
        .nav-btn:hover { color: #fff; background: rgba(34, 211, 238, 0.1); }
        .nav-btn.active { 
            background: linear-gradient(135deg, var(--accent-pink), #c026d3); 
            color: #ffffff; 
            font-weight: 700;
        }

        .tab-section { display: none; }
        .tab-section.active { display: block; }

        .card { 
            background: var(--bg-card); 
            border: 1px solid var(--border-subtle); 
            padding: 22px; 
            border-radius: 14px; 
            box-shadow: var(--shadow-card);
            backdrop-filter: blur(12px);
        }
        .card h2 { color: var(--accent-gold); margin-bottom: 16px; text-align: center; font-size: 1.15rem; font-weight: 700; letter-spacing: 0.3px; }

        .sub-nav { display: flex; justify-content: center; gap: 8px; margin-bottom: 16px; }
        .sub-btn { background: var(--bg-input); color: var(--text-muted); border: 1px solid var(--border-subtle); padding: 7px 16px; border-radius: 20px; cursor: pointer; font-size: 0.8rem; font-weight: 600; transition: all 0.2s ease; }
        .sub-btn.active { background: var(--accent-cyan); color: #080312; border-color: var(--accent-cyan); font-weight: 700; }

        .team-grid { 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 10px; 
            margin-bottom: 15px; 
        }
        @media (min-width: 600px) {
            .team-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px 16px;
            }
        }
        .team-item { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            background: var(--bg-input); 
            padding: 9px 12px; 
            border-radius: 8px; 
            font-size: 0.825rem; 
            border: 1px solid var(--border-subtle);
        }
        .team-item span { min-width: 50px; color: var(--accent-cyan); font-weight: 700; }
        .team-item input { flex: 1; padding: 6px 10px; background: rgba(0,0,0,0.5); border: 1px solid var(--border-subtle); color: #fff; border-radius: 6px; font-size: 0.825rem; }

        /* FORM PENDAFTARAN */
        .form-group { margin-bottom: 14px; text-align: left; }
        .form-group label { display: block; color: var(--accent-cyan); font-size: 0.775rem; font-weight: 700; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group input, .form-group select { width: 100%; padding: 10px 12px; background: var(--bg-input); border: 1px solid var(--border-subtle); color: #fff; border-radius: 8px; font-size: 0.85rem; transition: all 0.2s ease; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--border-focus); box-shadow: 0 0 10px rgba(236, 72, 153, 0.2); }

        .btn-action { background: linear-gradient(135deg, #ec4899, #c026d3); color: #ffffff; border: none; padding: 11px 18px; font-weight: 700; border-radius: 8px; cursor: pointer; font-size: 0.875rem; width: 100%; transition: all 0.2s ease; box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3); }
        .btn-action:hover { opacity: 0.95; transform: translateY(-1px); }

        /* TAMPILAN BACKGROUND KHUSUS BRACKET */
        #sec-pelajar, #sec-umum {
            background-image: url('222767.jpg');
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            border-radius: 16px;
            padding: 30px 10px;
            border: 1px solid var(--border-subtle);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        #sec-pelajar::before, #sec-umum::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(8, 3, 18, 0.3);
            border-radius: 16px;
            z-index: 0;
        }

        /* TAMPILAN BRACKET 7 KOLOM */
        .bracket-scroll { overflow-x: auto; padding-bottom: 10px; -webkit-overflow-scrolling: touch; position: relative; z-index: 1; }
        .bracket-flex { display: flex; gap: 12px; min-width: 1150px; justify-content: center; align-items: stretch; }
        .round-col { flex: 1; min-width: 160px; display: flex; flex-direction: column; justify-content: space-around; }
        .round-title { text-align: center; color: #ffffff; font-size: 0.75rem; font-weight: 800; margin-bottom: 8px; background: rgba(2, 132, 199, 0.4); padding: 6px; border-radius: 6px; border: 1px solid var(--accent-cyan); text-transform: uppercase; letter-spacing: 0.5px; box-shadow: 0 0 10px rgba(34, 211, 238, 0.2); }
