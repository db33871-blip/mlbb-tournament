<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOURNAMENT MLBB INFLY CARNIVAL</title>

    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --bg-dark: #0f111a;
            --bg-card: rgba(22, 26, 38, 0.85);
            --bg-input: rgba(12, 15, 23, 0.7);
            --accent-gold: #d4af37;
            --accent-cyan: #38bdf8;
            --border-subtle: rgba(255, 255, 255, 0.1);
            --border-active: rgba(56, 189, 248, 0.4);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        
        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at top, rgba(30, 41, 59, 0.5), transparent 70%), url('logo.jpeg');
            background-repeat: no-repeat;
            background-position: center top;
            background-size: cover;
            background-attachment: fixed;
            color: var(--text-main);
            padding: 16px 12px;
            min-height: 100vh;
        }

        #login-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 12, 18, 0.92);
            backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center;
            z-index: 99999; padding: 15px;
        }
        .modal-box {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            padding: 30px 24px;
            border-radius: 16px; width: 100%; max-width: 360px; text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .modal-box h2 { color: var(--accent-gold); margin-bottom: 8px; font-size: 1.25rem; letter-spacing: 1px; font-weight: 600; }
        .modal-box p { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px; }
        .modal-btn { width: 100%; padding: 11px; margin: 6px 0; font-weight: 600; border-radius: 8px; cursor: pointer; border: none; font-size: 0.9rem; transition: all 0.2s; }
        .btn-admin { background: var(--accent-gold); color: #0d0f14; }
        .btn-admin:hover { opacity: 0.9; }
        .btn-viewer { background: rgba(255, 255, 255, 0.05); color: var(--text-main); border: 1px solid var(--border-subtle); }
        .btn-viewer:hover { background: rgba(255, 255, 255, 0.1); }
        .panitia-box { display: none; margin-top: 12px; }
        .panitia-box input { width: 100%; padding: 10px; background: var(--bg-input); border: 1px solid var(--border-subtle); color: #fff; border-radius: 6px; margin-bottom: 8px; text-align: center; font-size: 0.85rem; }

        .container { max-width: 1000px; margin: 0 auto; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; background: var(--bg-card); padding: 8px 14px; border-radius: 10px; margin-bottom: 16px; border: 1px solid var(--border-subtle); }
        .role-badge { font-size: 0.8rem; font-weight: 600; padding: 4px 10px; border-radius: 20px; background: rgba(56, 189, 248, 0.1); color: var(--accent-cyan); border: 1px solid rgba(56, 189, 248, 0.2); }
        
        header { 
            text-align: center; 
            margin-bottom: 16px; 
            padding: 8px; 
        }
        header h1 { color: var(--text-main); font-size: 1.35rem; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 4px; }
        header p { color: var(--accent-cyan); font-size: 0.8rem; font-weight: 500; }

        .menu-container {
            position: relative;
            margin-bottom: 16px;
        }
        .hamburger-btn {
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border-subtle);
            padding: 9px 16px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .hamburger-btn:hover { border-color: var(--border-active); }

        .main-nav { 
            display: none; 
            position: absolute;
            top: 44px;
            left: 0;
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            padding: 8px;
            flex-direction: column; 
            gap: 4px; 
            min-width: 210px;
            z-index: 999;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }
        .main-nav.show { display: flex; }
        .nav-btn { 
            background: transparent; 
            color: var(--text-muted); 
            border: none; 
            padding: 10px 12px; 
            font-size: 0.825rem; 
            font-weight: 500; 
            border-radius: 6px; 
            cursor: pointer; 
            text-align: left;
            transition: all 0.2s;
        }
        .nav-btn:hover { color: var(--text-main); background: rgba(255,255,255,0.04); }
        .nav-btn.active { 
            background: var(--accent-cyan); 
            color: #0d0f14; 
            font-weight: 600;
        }

        .tab-section { display: none; }
        .tab-section.active { display: block; }

        .card { 
            background: var(--bg-card); 
            border: 1px solid var(--border-subtle); 
            padding: 20px; 
            border-radius: 14px; 
            backdrop-filter: blur(10px);
        }
        .card h2 { color: var(--text-main); margin-bottom: 16px; text-align: center; font-size: 1.1rem; font-weight: 600; letter-spacing: 0.5px; }

        .sub-nav { display: flex; justify-content: center; gap: 8px; margin-bottom: 16px; }
        .sub-btn { background: rgba(0,0,0,0.2); color: var(--text-muted); border: 1px solid var(--border-subtle); padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 0.8rem; font-weight: 500; transition: all 0.2s; }
        .sub-btn.active { background: var(--text-main); color: #0d0f14; font-weight: 600; border-color: var(--text-main); }

        .team-grid { 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 10px; 
            margin-bottom: 15px; 
        }
        @media (min-width: 600px) {
            .team-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px 14px;
            }
        }
        .team-item { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            background: var(--bg-input); 
            padding: 8px 12px; 
            border-radius: 8px; 
            font-size: 0.825rem; 
            border: 1px solid var(--border-subtle);
        }
        .team-item span { min-width: 50px; color: var(--text-muted); font-weight: 600; }
        .team-item input { flex: 1; padding: 6px 10px; background: rgba(0,0,0,0.3); border: 1px solid var(--border-subtle); color: #fff; border-radius: 6px; font-size: 0.825rem; }

        /* FORM PENDAFTARAN */
        .form-group { margin-bottom: 14px; text-align: left; }
        .form-group label { display: block; color: var(--text-muted); font-size: 0.775rem; font-weight: 600; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group input, .form-group select { width: 100%; padding: 10px 12px; background: var(--bg-input); border: 1px solid var(--border-subtle); color: #fff; border-radius: 8px; font-size: 0.85rem; transition: border-color 0.2s; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--accent-cyan); }

        .btn-action { background: var(--accent-cyan); color: #0d0f14; border: none; padding: 10px 18px; font-weight: 600; border-radius: 8px; cursor: pointer; font-size: 0.85rem; width: 100%; transition: opacity 0.2s; }
        .btn-action:hover { opacity: 0.9; }

        .bracket-scroll { overflow-x: auto; padding-bottom: 10px; -webkit-overflow-scrolling: touch; }
        .bracket-flex { display: flex; gap: 14px; min-width: 950px; }
        .round-col { flex: 1; min-width: 190px; display: flex; flex-direction: column; justify-content: space-around; }
        .round-title { text-align: center; color: var(--text-main); font-size: 0.775rem; font-weight: 600; margin-bottom: 8px; background: rgba(0,0,0,0.3); padding: 6px; border-radius: 6px; border: 1px solid var(--border-subtle); letter-spacing: 0.5px; }

        .matchup { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 8px; margin: 6px 0; overflow: hidden; }
        .matchup.final { border: 1px solid var(--accent-gold); }
        .matchup.third { border: 1px solid var(--accent-cyan); }
        .match-label { background: rgba(255,255,255,0.05); font-size: 0.65rem; color: var(--text-muted); text-align: center; padding: 3px; font-weight: 600; border-bottom: 1px solid var(--border-subtle); }

        .team-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; font-size: 0.75rem; border-bottom: 1px solid var(--border-subtle); }
        .team-row:last-child { border-bottom: none; }
        .team-row.winner { background: rgba(56, 189, 248, 0.12); font-weight: 600; color: var(--accent-cyan); }
        .team-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-right: 6px; color: var(--text-main); }

        .score-in { width: 30px; background: var(--bg-input); border: 1px solid var(--border-subtle); color: #fff; text-align: center; padding: 3px; border-radius: 4px; font-weight: 600; font-size: 0.75rem; }

        .history-log { max-height: 300px; overflow-y: auto; background: var(--bg-input); border-radius: 8px; padding: 10px; font-size: 0.75rem; border: 1px solid var(--border-subtle); }
        .log-item { padding: 6px 0; border-bottom: 1px solid var(--border-subtle); display: flex; justify-content: space-between; }
        
        /* TIM TERDAFTAR CARD */
        .registered-card {
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 10px;
        }
        .registered-card h3 {
            color: var(--text-main);
            font-size: 0.9rem;
            margin-bottom: 8px;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 6px;
            font-weight: 600;
        }
        .registered-card p {
            font-size: 0.775rem;
            color: var(--text-muted);
            margin: 4px 0;
        }
        .registered-card span {
            color: var(--accent-cyan);
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div id="login-modal">
        <div class="modal-box">
            <h2>Pilih Akses Masuk</h2>
            <p>Silakan pilih menu masuk di bawah ini:</p>
            <button class="modal-btn btn-viewer" onclick="setRole('viewer')">👤 Login Peserta</button>
            <button class="modal-btn btn-admin" onclick="showPanitiaBox()">🛡️ Login Panitia</button>
            
            <div id="panitia-box" class="panitia-box">
                <input type="text" id="panitia-user" placeholder="Username Panitia">
                <input type="password" id="panitia-pass" placeholder="Password">
                <button class="modal-btn btn-admin" onclick="verifyPanitiaLogin()">Masuk Panitia</button>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="top-bar">
            <span id="role-display" class="role-badge">Status: Peserta</span>
            <button class="btn-action" style="padding: 4px 10px; font-size: 0.75rem; width: auto; background: transparent; color: var(--text-muted); border: 1px solid var(--border-subtle);" onclick="logout()">Keluar / Ganti</button>
        </div>

        <header>
            <h1>TOURNAMENT MLBB INFLY CARNIVAL</h1>
            <p>Kategori Pelajar & Umum (16 Tim)</p>
        </header>

        <div class="menu-container">
            <button class="hamburger-btn" onclick="toggleMenu()">
                <span>☰</span> Menu Navigasi
            </button>
            <div class="main-nav" id="dropdown-menu">
                <button class="nav-btn active" onclick="switchTab(event, 'sec-daftar')">📝 Pendaftaran MLBB</button>
                <button class="nav-btn" onclick="switchTab(event, 'sec-registered')">📜 Tim Terdaftar</button>
                <button class="nav-btn" onclick="switchTab(event, 'sec-teams')">📋 Daftar Tim</button>
                <button class="nav-btn" onclick="switchTab(event, 'sec-pelajar')">🎓 Bracket Pelajar</button>
                <button class="nav-btn" onclick="switchTab(event, 'sec-umum')">🔥 Bracket Umum</button>
                <button class="nav-btn" id="nav-history" style="display: none;" onclick="switchTab(event, 'sec-history')">📜 Riwayat</button>
            </div>
        </div>

        <!-- MENU PENDAFTARAN -->
        <div id="sec-daftar" class="tab-section active">
            <div class="card" style="max-width: 480px; margin: 0 auto;">
                <h2>Formulir Pendaftaran Tim</h2>
                <div class="form-group">
                    <label>Kategori Turnamen</label>
                    <select id="reg-kategori">
                        <option value="pelajar">Pelajar (16 Tim)</option>
                        <option value="umum">Umum (16 Tim)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Nama Tim</label>
                    <input type="text" id="reg-namatim" placeholder="Masukkan Nama Tim">
                </div>
                <div class="form-group">
                    <label>Nomor Slot Tim (Pilih 1 - 16)</label>
                    <select id="reg-slot">
                        <option value="0">Tim 1</option>
                        <option value="1">Tim 2</option>
                        <option value="2">Tim 3</option>
                        <option value="3">Tim 4</option>
                        <option value="4">Tim 5</option>
                        <option value="5">Tim 6</option>
                        <option value="6">Tim 7</option>
                        <option value="7">Tim 8</option>
                        <option value="8">Tim 9</option>
                        <option value="9">Tim 10</option>
                        <option value="10">Tim 11</option>
                        <option value="11">Tim 12</option>
                        <option value="12">Tim 13</option>
                        <option value="13">Tim 14</option>
                        <option value="14">Tim 15</option>
                        <option value="15">Tim 16</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Nama Kapten / Perwakilan</label>
                    <input type="text" id="reg-kapten" placeholder="Nama Lengkap Kapten">
                </div>
                <div class="form-group">
                    <label>ID MLBB Kapten</label>
                    <input type="text" id="reg-id-kapten" placeholder="Contoh: 12345678 (1234)">
                </div>
                <div class="form-group">
                    <label>ID MLBB Pemain 2</label>
                    <input type="text" id="reg-id-p2" placeholder="Contoh: 12345678 (1234)">
                </div>
                <div class="form-group">
                    <label>ID MLBB Pemain 3</label>
                    <input type="text" id="reg-id-p3" placeholder="Contoh: 12345678 (1234)">
                </div>
                <div class="form-group">
                    <label>ID MLBB Pemain 4</label>
                    <input type="text" id="reg-id-p4" placeholder="Contoh: 12345678 (1234)">
                </div>
                <div class="form-group">
                    <label>ID MLBB Pemain 5</label>
                    <input type="text" id="reg-id-p5" placeholder="Contoh: 12345678 (1234)">
                </div>
                <div class="form-group">
                    <label>ID MLBB Cadangan</label>
                    <input type="text" id="reg-id-cadangan" placeholder="Contoh: 12345678 (1234)">
                </div>
                <div class="form-group">
                    <label>Nomor WhatsApp (Aktif)</label>
                    <input type="text" id="reg-wa" placeholder="Contoh: 08123456789">
                </div>
                <button class="btn-action" onclick="submitPendaftaran()">Kirim Pendaftaran</button>
            </div>
        </div>

        <!-- MENU TIM TERDAFTAR -->
        <div id="sec-registered" class="tab-section">
            <div class="card">
                <h2>Data Tim Terdaftar</h2>
                <div class="sub-nav">
                    <button class="sub-btn active" onclick="switchSubReg(event, 'sub-reg-pelajar')">Pelajar</button>
                    <button class="sub-btn" onclick="switchSubReg(event, 'sub-reg-umum')">Umum</button>
                </div>
                <div id="sub-reg-pelajar" class="sub-reg-content">
                    <div id="list-registered-pelajar"><p style="text-align:center; color:var(--text-muted);">Belum ada tim terdaftar.</p></div>
                </div>
                <div id="sub-reg-umum" class="sub-reg-content" style="display: none;">
                    <div id="list-registered-umum"><p style="text-align:center; color:var(--text-muted);">Belum ada tim terdaftar.</p></div>
                </div>
            </div>
        </div>

        <div id="sec-teams" class="tab-section">
            <div class="card">
                <h2>Daftar Tim Peserta</h2>
                <div class="sub-nav">
                    <button class="sub-btn active" onclick="switchSub(event, 'sub-pelajar')">Pelajar (16 Tim)</button>
                    <button class="sub-btn" onclick="switchSub(event, 'sub-umum')">Umum (16 Tim)</button>
                </div>
                <div id="sub-pelajar" class="sub-content">
                    <div class="team-grid" id="grid-pelajar"></div>
                    <div id="save-pelajar" style="text-align: center; display: none; margin-top: 15px;">
                        <button class="btn-action" style="width: auto;" onclick="saveTeams('pelajar')">Simpan Bagan Pelajar</button>
                    </div>
                </div>
                <div id="sub-umum" class="sub-content" style="display: none;">
                    <div class="team-grid" id="grid-umum"></div>
                    <div id="save-umum" style="text-align: center; display: none; margin-top: 15px;">
                        <button class="btn-action" style="width: auto;" onclick="saveTeams('umum')">Simpan Bagan Umum</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="sec-pelajar" class="tab-section">
            <div class="bracket-scroll">
                <div class="bracket-flex" id="bracket-pelajar"></div>
            </div>
        </div>

        <div id="sec-umum" class="tab-section">
            <div class="
