<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOURNAMENT MLBB INFLY CARNIVAL</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --bg-primary: #1e0533;
            --bg-secondary: rgba(46, 12, 75, 0.9);
            --accent-gold: #f59e0b;
            --accent-cyan: #38bdf8;
            --text-white: #ffffff;
            --border-color: rgba(56, 189, 248, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background: linear-gradient(135deg, #2e0854 0%, #4a0e4e 50%, #0369a1 100%);
            background-attachment: fixed; color: var(--text-white); padding: 20px; min-height: 100vh; position: relative;
        }

        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
            background-size: 16px 16px; pointer-events: none; z-index: 0;
        }

        .container { position: relative; z-index: 1; max-width: 100%; margin: 0 auto; }

        #login-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 5, 25, 0.95); display: flex; justify-content: center; align-items: center; z-index: 9999;
        }

        .modal-box {
            background: var(--bg-secondary); border: 2px solid var(--accent-gold); padding: 30px;
            border-radius: 12px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 0 30px rgba(245, 158, 11, 0.4);
        }

        .modal-box h2 { color: var(--accent-gold); margin-bottom: 15px; text-transform: uppercase; letter-spacing: 2px; }
        .modal-box p { color: #cbd5e1; font-size: 0.9rem; margin-bottom: 20px; }

        .modal-btn { width: 100%; padding: 12px; margin: 8px 0; font-weight: bold; border-radius: 6px; cursor: pointer; border: none; font-size: 1rem; transition: 0.2s; }
        .btn-admin { background: var(--accent-gold); color: #1e0533; }
        .btn-admin:hover { background: #d97706; }
        .btn-viewer { background: rgba(56, 189, 248, 0.2); color: var(--accent-cyan); border: 1px solid var(--accent-cyan); }
        .btn-viewer:hover { background: rgba(56, 189, 248, 0.4); }

        .panitia-login-box { display: none; margin-top: 15px; }
        .panitia-login-box input {
            width: 100%; padding: 10px; background: rgba(0,0,0,0.5); border: 1px solid var(--border-color);
            color: #fff; border-radius: 4px; margin-bottom: 10px; text-align: center;
        }

        .top-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(30, 5, 51, 0.8); padding: 10px 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid var(--border-color); }
        .role-badge { font-size: 0.9rem; font-weight: bold; padding: 5px 12px; border-radius: 20px; }
        .badge-admin { background: rgba(245, 158, 11, 0.2); color: var(--accent-gold); border: 1px solid var(--accent-gold); }
        .badge-viewer { background: rgba(56, 189, 248, 0.2); color: var(--accent-cyan); border: 1px solid var(--accent-cyan); }

        header { text-align: center; margin-bottom: 25px; padding: 20px; background: linear-gradient(180deg, rgba(76, 29, 149, 0.7) 0%, rgba(30, 5, 51, 0.9) 100%); border: 2px solid rgba(245, 158, 11, 0.5); border-radius: 12px; box-shadow: 0 0 25px rgba(192, 132, 252, 0.4); }
        header h1 { color: var(--accent-gold); font-size: 2.3rem; text-transform: uppercase; letter-spacing: 3px; text-shadow: 0 0 15px rgba(245, 158, 11, 0.6); margin-bottom: 5px; }
        header p { color: var(--accent-cyan); font-size: 1rem; letter-spacing: 1px; }

        .main-nav { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; }
        .nav-btn { background-color: rgba(30, 5, 51, 0.9); color: var(--accent-cyan); border: 2px solid var(--accent-cyan); padding: 12px 25px; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: all 0.3s ease; }
        .nav-btn.active { background-color: var(--accent-gold); color: #1e0533; border-color: var(--accent-gold); box-shadow: 0 0 20px rgba(245, 158, 11, 0.6); transform: translateY(-2px); }

        .tab-section { display: none; }
        .tab-section.active { display: block; }

        .team-list-container { background: var(--bg-secondary); border: 1px solid var(--border-color); padding: 25px; border-radius: 12px; max-width: 900px; margin: 0 auto; }
        .team-list-container h2 { color: var(--accent-gold); margin-bottom: 20px; text-align: center; }
        .sub-tab-container { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .sub-tab-btn { background: rgba(0,0,0,0.4); color: #cbd5e1; border: 1px solid var(--border-color); padding: 8px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .sub-tab-btn.active { background: var(--accent-cyan); color: #1e0533; border-color: var(--accent-cyan); }
        .sub-content { display: none; }
        .sub-content.active { display: block; }

        .team-inputs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .team-input-item { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; background: rgba(0,0,0,0.3); padding: 8px 12px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.05); }
        .team-input-item span { min-width: 55px; color: var(--accent-cyan); font-weight: bold; }
        .team-input-item input { flex-grow: 1; padding: 6px 10px; background: rgba(0,0,0,0.5); border: 1px solid var(--border-color); color: #fff; border-radius: 4px; }

        .bracket-scroll-area { overflow-x: auto; padding-bottom: 20px; }
        .bracket-container { display: flex; justify-content: flex-start; gap: 30px; min-width: 1350px; padding: 10px 0; }
        .round { display: flex; flex-direction: column; justify-content: space-around; flex: 1; min-width: 260px; }
        .round-title { text-align: center; color: var(--accent-gold); font-size: 1.1rem; font-weight: bold; margin-bottom: 15px; text-transform: uppercase; background: rgba(0, 0, 0, 0.4); padding: 6px; border-radius: 6px; border: 1px solid rgba(245, 158, 11, 0.3); }
        
        .matchup { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 8px; margin: 10px 0; overflow: hidden; }
        .matchup.final-match { border: 2px solid var(--accent-gold); }
        .matchup.third-match { border: 2px solid var(--accent-cyan); }
        .matchup-label { background: rgba(0, 0, 0, 0.5); font-size: 0.75rem; color: var(--accent-cyan); text-align: center; padding: 4px; font-weight: bold; }
        
        .team { display: flex; justify-content: space-between; align-items: center; padding: 9px 12px; font-size: 0.9rem; border-bottom: 1px solid rgba(255, 255, 255, 0.08); transition: background 0.3s; }
        .team:last-child { border-bottom: none; }
        .team.winner { background: rgba(245, 158, 11, 0.3); font-weight: bold; }
        .team-name { flex-grow: 1; margin-right: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
        
        .score-input { width: 38px; background: rgba(0, 0, 0, 0.6); border: 1px solid var(--border-color); color: var(--accent-cyan); font-weight: bold; text-align: center; padding: 4px; border-radius: 4px; }
        .btn { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: #1e0533; border: none; padding: 12px 28px; font-weight: bold; font-size: 1rem; border-radius: 8px; cursor: pointer; }
        .btn:hover { transform: translateY(-2px); }
    </style>
</head>
<body>

    <div id="login-modal">
        <div class="modal-box">
            <h2>Pilih Akses Masuk</h2>
            <p>Silakan pilih menu masuk di bawah ini:</p>
            <button class="modal-btn btn-viewer" onclick="setRole('viewer')">👤 Login Peserta</button>
            <button class="modal-btn btn-admin" onclick="showPanitiaLoginBox()">🛡️ Login Panitia</button>
            
            <div id="panitia-login-container" class="panitia-login-box">
                <input type="text" id="panitia-user-input" placeholder="Masukkan Username">
                <input type="password" id="panitia-pass-input" placeholder="Masukkan Password">
                <button class="modal-btn btn-admin" onclick="verifyPanitiaLogin()">Masuk Panitia</button>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="top-bar">
            <span id="role-display" class="role-badge badge-viewer">Status: Peserta</span>
            <button class="btn" style="padding: 6px 15px; font-size: 0.85rem;" onclick="location.reload()">Ganti Peran / Keluar</button>
        </div>

        <header>
            <h1>TOURNAMENT MLBB INFLY CARNIVAL</h1>
            <p>Kategori Pelajar & Umum (16 Tim)</p>
        </header>

        <div class="main-nav">
            <button class="nav-btn active" onclick="switchMainTab(event, 'section-teams')">📋 Daftar Tim Terdaftar</button>
            <button class="nav-btn" onclick="switchMainTab(event, 'section-pelajar')">🎓 Bracket Pelajar</button>
            <button class="nav-btn" onclick="switchMainTab(event, 'section-umum')">🔥 Bracket Umum</button>
        </div>

        <!-- DAFTAR TIM -->
        <div id="section-teams" class="tab-section active">
            <div class="team-list-container">
                <h2>Manajemen Daftar Tim Peserta</h2>
                <div class="sub-tab-container">
                    <button class="sub-tab-btn active" onclick="switchSubTab(event, 'sub-pelajar')">Kategori Pelajar (16 Tim)</button>
                    <button class="sub-tab-btn" onclick="switchSubTab(event, 'sub-umum')">Kategori Umum (16 Tim)</button>
                </div>
                <div id="sub-pelajar" class="sub-content active">
                    <div class="team-inputs-grid" id="pelajar-team-inputs"></div>
                    <div id="admin-save-pelajar" style="text-align: center; margin-top: 20px; display: none;">
                        <button class="btn" onclick="saveTeamsToFirebase('pelajar')">Simpan & Perbarui Bagan Pelajar</button>
                    </div>
                </div>
                <div id="sub-umum" class="sub-content">
                    <div class="team-inputs-grid" id="umum-team-inputs"></div>
                    <div id="admin-save-umum" style="text-align: center; margin-top: 20px; display: none;">
                        <button class="btn" onclick="saveTeamsToFirebase('umum')">Simpan & Perbarui Bagan Umum</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- BRACKET PELAJAR -->
        <div id="section-pelajar" class="tab-section">
            <div class="bracket-scroll-area">
                <div class="bracket-container" id="bracket-pelajar-container"></div>
            </div>
        </div>

        <!-- BRACKET UMUM -->
        <div id="section-umum" class="tab-section">
            <div class="bracket-scroll-area">
                <div class="bracket-container" id="bracket-umum-container"></div>
            </div>
        </div>

    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA093jfB0I5cZhy0-BfAWUaEPUIobBxQXA",
            authDomain: "tournamen-mlbb-infly-carnival.firebaseapp.com",
            databaseURL: "https://tournamen-mlbb-infly-carnival-default-rtdb.firebaseio.com",
            projectId: "tournamen-mlbb-infly-carnival",
            storageBucket: "tournamen-mlbb-infly-carnival.firebasestorage.app"
        };

        let db = null;
        let currentUserRole = 'viewer';

        // Data lokal
        const tournamentData = {
            pelajar: { teams: Array(16).fill(""), scores: Array(16).fill(null).map(() => ({ s1: 0, s2: 0 })) },
            umum: { teams: Array(16).fill(""), scores: Array(16).fill(null).map(() => ({ s1: 0, s2: 0 })) }
        };

        for (let i = 0; i < 16; i++) {
            tournamentData.pelajar.teams[i] = "Tim " + (i + 1);
            tournamentData.umum.teams[i] = "Tim " + (i + 1);
        }

        window.onload = function() {
            initInputs('pelajar');
            initInputs('umum');
            renderBracketUI('pelajar');
            renderBracketUI('umum');
            
            try {
                if (typeof firebase !== 'undefined') {
                    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
                    db = firebase.database();
                    listenFirebaseData();
                }
            } catch (e) {
                console.error(e);
            }
        };

        function initInputs(category) {
            const container = document.getElementById(category + '-team-inputs');
            container.innerHTML = '';
            for (let i = 0; i < 16; i++) {
                container.innerHTML += '<div class="team-input-item"><span>Tim '+(i+1)+':</span><input type="text" id="'+category+'-field-'+i+'" value="'+tournamentData[category].teams[i]+'"></div>';
            }
        }

        function renderBracketUI(category) {
            const container = document.getElementById('bracket-' + category + '-container');
            if(!container) return;

            let html = '';
            
            // 16 Besar (Match 0 - 7)
            html += '<div class="round"><div class="round-title">16 Besar '+(category.toUpperCase())+'</div>';
            for(let m = 0; m < 8; m++) {
                html += createMatchHTML(category, m);
            }
            html += '</div>';

            // Perempat Final (Match 8 - 11)
            html += '<div class="round"><div class="round-title">Perempat Final</div>';
            for(let m = 8; m < 12; m++) {
                html += createMatchHTML(category, m, 'margin: 25px 0;');
            }
            html += '</div>';

            // Semifinal (Match 12 - 13)
            html += '<div class="round"><div class="round-title">Semifinal</div>';
            for(let m = 12; m < 14; m++) {
                html += createMatchHTML(category, m, 'margin: 75px 0;');
            }
            html += '</div>';

            // Perebutan Juara (Grand Final & Juara 3)
            html += '<div class="round" style="justify-content: center;"><div class="round-title">Perebutan Juara</div>';
            html += createMatchHTML(category, 14, '', 'final-match', '👑 Grand Final');
            html += createMatchHTML(category, 15, 'margin-top: 30px;', 'third-match', '🥉 Juara 3 & 4');
            html += '</div>';

            container.innerHTML = html;
            updateBracketLogic(category);
        }

        function createMatchHTML(category, matchIdx, style = '', extraClass = '', label = '') {
            const prefix = category[0];
            return `
                <div class="matchup ${extraClass}" style="${style}">
                    ${label ? `<div class="matchup-label">${label}</div>` : ''}
                    <div class="team" id="${prefix}-m${matchIdx}-box1">
                        <span class="team-name" id="${prefix}-m${matchIdx}-t1">-</span>
                        <input type="number" min="0" class="score-input ${prefix}-score" id="${prefix}-m${matchIdx}-s1" value="0" oninput="onScoreInput('${category}', ${matchIdx})">
                    </div>
                    <div class="team" id="${prefix}-m${matchIdx}-box2">
                        <span class="team-name" id="${prefix}-m${matchIdx}-t2">-</span>
                        <input type="number" min="0" class="score-input ${prefix}-score" id="${prefix}-m${matchIdx}-s2" value="0" oninput="onScoreInput('${category}', ${matchIdx})">
                    </div>
                </div>
            `;
        }

        // KUNCI UTAMA: Logika Otomatisasi Bagan Pemenang
        function updateBracketLogic(category) {
            const prefix = category[0];
            const data = tournamentData[category];
            const teams = data.teams;
            const scores = data.scores;

            // Struktur Pemenang & Pecundang
            const winners = Array(16).fill("-");
            const losers = Array(16).fill("-");

            // 1. Babak 16 Besar (Match 0 - 7)
            for(let m = 0; m < 8; m++) {
                const t1 = teams[m * 2] || "Tim " + (m*2+1);
                const t2 = teams[m * 2 + 1] || "Tim " + (m*2+2);
                setMatchDisplay(prefix, m, t1, t2, scores[m]);

                if (scores[m].s1 > scores[m].s2) { winners[m] = t1; losers[m] = t2; }
                else if (scores[m].s2 > scores[m].s1) { winners[m] = t2; losers[m] = t1; }
            }

            // 2. Perempat Final (Match 8 - 11)
            for(let i = 0; i < 4; i++) {
                const m = 8 + i;
                const t1 = winners[i * 2];
                const t2 = winners[i * 2 + 1];
                setMatchDisplay(prefix, m, t1, t2, scores[m]);

                if (scores[m].s1 > scores[m].s2 && t1 !== "-") { winners[m] = t1; losers[m] = t2; }
                else if (scores[m].s2 > scores[m].s1 && t2 !== "-") { winners[m] = t2; losers[m] = t1; }
            }

            // 3. Semifinal (Match 12 - 13)
            for(let i = 0; i < 2; i++) {
                const m = 12 + i;
                const t1 = winners[8 + i * 2];
                const t2 = winners[8 + i * 2 + 1];
                setMatchDisplay(prefix, m, t1, t2, scores[m]);

                if (scores[m].s1 > scores[m].s2 && t1 !== "-") { winners[m] = t1; losers[m] = t2; }
                else if (scores[m].s2 > scores[m].s1 && t2 !== "-") { winners[m] = t2; losers[m] = t1; }
            }

            // 4. Grand Final (Match 14) & Juara 3 (Match 15)
            const finalT1 = winners[12];
            const finalT2 = winners[13];
            setMatchDisplay(prefix, 14, finalT1, finalT2, scores[14]);

            const thirdT1 = losers[12];
            const thirdT2 = losers[13];
            setMatchDisplay(prefix, 15, thirdT1, thirdT2, scores[15]);
        }

        function setMatchDisplay(prefix, matchIdx, t1Name, t2Name, scoreObj) {
            const elT1 = document.getElementById(`${prefix}-m${matchIdx}-t1`);
            const elT2 = document.getElementById(`${prefix}-m${matchIdx}-t2`);
            const elS1 = document.getElementById(`${prefix}-m${matchIdx}-s1`);
            const elS2 = document.getElementById(`${prefix}-m${matchIdx}-s2`);
            const box1 = document.getElementById(`${prefix}-m${matchIdx}-box1`);
            const box2 = document.getElementById(`${prefix}-m${matchIdx}-box2`);

            if (elT1) elT1.textContent = t1Name;
            if (elT2) elT2.textContent = t2Name;
            if (elS1 && document.activeElement !== elS1) elS1.value = scoreObj ? scoreObj.s1 : 0;
            if (elS2 && document.activeElement !== elS2) elS2.value = scoreObj ? scoreObj.s2 : 0;

            // Highlight Pemenang
            if (box1 && box2) {
                box1.classList.remove('winner');
                box2.classList.remove('winner');
                if (scoreObj) {
                    if (scoreObj.s1 > scoreObj.s2 && t1Name !== "-") box1.classList.add('winner');
                    else if (scoreObj.s2 > scoreObj.s1 && t2Name !== "-") box2.classList.add('winner');
                }
            }
        }

        function onScoreInput(category, matchIdx) {
            const prefix = category[0];
            const s1Val = parseInt(document.getElementById(`${prefix}-m${matchIdx}-s1`).value) || 0;
            const s2Val = parseInt(document.getElementById(`${prefix}-m${matchIdx}-s2`).value) || 0;

            tournamentData[category].scores[matchIdx] = { s1: s1Val, s2: s2Val };
            updateBracketLogic(category);

            if (currentUserRole === 'admin' && db) {
                db.ref(`tournament/${category}/scores`).set(tournamentData[category].scores);
            }
        }

        function saveTeamsToFirebase(category) {
            if(!db) return alert("Firebase belum terhubung.");
            const newTeams = [];
            for (let i = 0; i < 16; i++) {
                const val = document.getElementById(`${category}-field-${i}`).value.trim();
                newTeams.push(val || "Tim " + (i + 1));
            }
            db.ref(`tournament/${category}/teams`).set(newTeams)
              .then(() => alert(`Daftar tim ${category.toUpperCase()} berhasil disimpan & bagan diperbarui!`))
              .catch((err) => alert("Gagal menyimpan: " + err.message));
        }

        function listenFirebaseData() {
            ['pelajar', 'umum'].forEach(category => {
                db.ref(`tournament/${category}/teams`).on('value', snapshot => {
                    const data = snapshot.val();
                    if (data && Array.isArray(data)) {
                        tournamentData[category].teams = data;
                        for (let i = 0; i < 16; i++) {
                            const field = document.getElementById(`${category}-field-${i}`);
                            if (field && document.activeElement !== field) field.value = data[i] || ("Tim " + (i+1));
                        }
                        updateBracketLogic(category);
                    }
                });

                db.ref(`tournament/${category}/scores`).on('value', snapshot => {
                    const data = snapshot.val();
                    if (data && Array.isArray(data)) {
                        tournamentData[category].scores = data;
                        updateBracketLogic(category);
                    }
                });
            });
        }

        function setRole(role, username = '') {
            document.getElementById('login-modal').style.display = 'none';
            currentUserRole = role;
            const badge = document.getElementById('role-display');
            
            if (role === 'admin') {
                badge.className = 'role-badge badge-admin';
                badge.textContent = 'Status: Panitia (' + username.toUpperCase() + ')';
                document.getElementById('admin-save-pelajar').style.display = 'block';
                document.getElementById('admin-save-umum').style.display = 'block';
                setInputsEditable(true);
            } else {
                badge.className = 'role-badge badge-viewer';
                badge.textContent = 'Status: Peserta (Hanya Lihat)';
                document.getElementById('admin-save-pelajar').style.display = 'none';
                document.getElementById('admin-save-umum').style.display = 'none';
                setInputsEditable(false);
            }
        }

        function showPanitiaLoginBox() { document.getElementById('panitia-login-container').style.display = 'block'; }

        function verifyPanitiaLogin() {
            const userInput = document.getElementById('panitia-user-input').value.trim().toLowerCase();
            const passInput = document.getElementById('panitia-pass-input').value;
            const panitiaUsers = { "bentar": "infly2026", "dwi": "infly2026", "rafa": "infly2026", "nuzul": "infly2026", "dimas": "infly2026", "ipank": "infly2026", "dana": "infly2026", "untung": "infly2026" };
            if (panitiaUsers[userInput] && panitiaUsers[userInput] === passInput) { setRole('admin', userInput); } else { alert('Username atau Password salah!'); }
        }

        function setInputsEditable(enable) {
            document.querySelectorAll('.score-input').forEach(input => input.disabled = !enable);
            document.querySelectorAll('.team-inputs-grid input').forEach(input => input.disabled = !enable);
        }

        function switchMainTab(evt, sectionId) {
            document.querySelectorAll('.tab-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
            evt.currentTarget.classList.add('active');
        }

        function switchSubTab(evt, subId) {
            document.querySelectorAll('.sub-content').forEach(sub => sub.classList.remove('active'));
            document.querySelectorAll('.sub-tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(subId).classList.add('active');
            evt.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
