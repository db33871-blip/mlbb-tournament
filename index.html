<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOURNAMENT MLBB INFLY CARNIVAL</title>
    
    <!-- Firebase SDK (Versi Stabil v8.10.1) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --bg-primary: #1e0533;
            --bg-secondary: rgba(46, 12, 75, 0.9);
            --accent-gold: #f59e0b;
            --accent-cyan: #38bdf8;
            --text-white: #ffffff;
            --border-color: rgba(56, 189, 248, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #2e0854 0%, #4a0e4e 50%, #0369a1 100%);
            background-attachment: fixed;
            color: var(--text-white);
            padding: 20px;
            min-height: 100vh;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
            background-size: 16px 16px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 100%;
            margin: 0 auto;
        }

        /* MODAL LOGIN */
        #login-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 5, 25, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .modal-box {
            background: var(--bg-secondary);
            border: 2px solid var(--accent-gold);
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 30px rgba(245, 158, 11, 0.4);
        }

        .modal-box h2 {
            color: var(--accent-gold);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .modal-box p { color: #cbd5e1; font-size: 0.9rem; margin-bottom: 20px; }

        .modal-btn {
            width: 100%; padding: 12px; margin: 8px 0; font-weight: bold;
            border-radius: 6px; cursor: pointer; border: none; font-size: 1rem; transition: 0.2s;
        }

        .btn-admin { background: var(--accent-gold); color: #1e0533; }
        .btn-admin:hover { background: #d97706; }
        .btn-viewer { background: rgba(56, 189, 248, 0.2); color: var(--accent-cyan); border: 1px solid var(--accent-cyan); }
        .btn-viewer:hover { background: rgba(56, 189, 248, 0.4); }

        .panitia-login-box { display: none; margin-top: 15px; }
        .panitia-login-box input {
            width: 100%; padding: 10px; background: rgba(0,0,0,0.5);
            border: 1px solid var(--border-color); color: #fff; border-radius: 4px;
            margin-bottom: 10px; text-align: center;
        }

        /* HEADER & NAV */
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(30, 5, 51, 0.8); padding: 10px 20px; border-radius: 8px;
            margin-bottom: 20px; border: 1px solid var(--border-color);
        }

        .role-badge { font-size: 0.9rem; font-weight: bold; padding: 5px 12px; border-radius: 20px; }
        .badge-admin { background: rgba(245, 158, 11, 0.2); color: var(--accent-gold); border: 1px solid var(--accent-gold); }
        .badge-viewer { background: rgba(56, 189, 248, 0.2); color: var(--accent-cyan); border: 1px solid var(--accent-cyan); }

        header {
            text-align: center; margin-bottom: 25px; padding: 20px;
            background: linear-gradient(180deg, rgba(76, 29, 149, 0.7) 0%, rgba(30, 5, 51, 0.9) 100%);
            border: 2px solid rgba(245, 158, 11, 0.5); border-radius: 12px;
            box-shadow: 0 0 25px rgba(192, 132, 252, 0.4);
        }

        header h1 {
            color: var(--accent-gold); font-size: 2.3rem; text-transform: uppercase;
            letter-spacing: 3px; text-shadow: 0 0 15px rgba(245, 158, 11, 0.6); margin-bottom: 5px;
        }

        header p { color: var(--accent-cyan); font-size: 1rem; letter-spacing: 1px; }

        .main-nav { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; }
        .nav-btn {
            background-color: rgba(30, 5, 51, 0.9); color: var(--accent-cyan);
            border: 2px solid var(--accent-cyan); padding: 12px 25px; font-size: 1rem;
            font-weight: bold; border-radius: 8px; cursor: pointer; transition: all 0.3s ease;
        }
        .nav-btn.active {
            background-color: var(--accent-gold); color: #1e0533; border-color: var(--accent-gold);
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.6); transform: translateY(-2px);
        }

        .tab-section { display: none; }
        .tab-section.active { display: block; }

        /* TAB INPUT TIM */
        .team-list-container {
            background: var(--bg-secondary); border: 1px solid var(--border-color);
            padding: 25px; border-radius: 12px; max-width: 900px; margin: 0 auto;
        }
        .team-list-container h2 { color: var(--accent-gold); margin-bottom: 20px; text-align: center; }

        .sub-tab-container { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .sub-tab-btn {
            background: rgba(0,0,0,0.4); color: #cbd5e1; border: 1px solid var(--border-color);
            padding: 8px 20px; border-radius: 6px; cursor: pointer; font-weight: bold;
        }
        .sub-tab-btn.active { background: var(--accent-cyan); color: #1e0533; border-color: var(--accent-cyan); }

        .sub-content { display: none; }
        .sub-content.active { display: block; }
