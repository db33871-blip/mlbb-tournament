<form id="formPendaftaran">
  <!-- Kategori Turnamen -->
  <div class="mb-3">
    <label class="form-label text-warning fw-bold">Kategori Turnamen</label>
    <select class="form-select bg-dark text-white border-secondary">
      <option value="Pelajar (16 Tim)">Pelajar (16 Tim)</option>
      <option value="Umum (16 Tim)">Umum (16 Tim)</option>
    </select>
  </div>

  <!-- Nama Tim -->
  <div class="mb-3">
    <label class="form-label text-warning fw-bold">Nama Tim</label>
    <input type="text" class="form-control bg-dark text-white border-secondary" placeholder="Masukkan Nama Tim" required>
  </div>

  <!-- Nomor Slot Tim -->
  <div class="mb-3">
    <label class="form-label text-warning fw-bold">Nomor Slot Tim (Pilih 1 - 16)</label>
    <select class="form-select bg-dark text-white border-secondary">
      <option value="Tim 1">Tim 1</option>
      <option value="Tim 2">Tim 2</option>
      <!-- Tambahkan opsi tim 3-16 sesuai kebutuhan -->
    </select>
  </div>

  <!-- Nama Kapten -->
  <div class="mb-3">
    <label class="form-label text-warning fw-bold">Nama Kapten / Perwakilan</label>
    <input type="text" class="form-control bg-dark text-white border-secondary" placeholder="Nama Lengkap Kapten" required>
  </div>

  <!-- ID MLBB Kapten -->
  <div class="mb-3">
    <label class="form-label text-warning fw-bold">ID MLBB Kapten (Server)</label>
    <input type="text" class="form-control bg-dark text-white border-secondary" placeholder="Contoh: 12345678 (1234)" required>
  </div>

  <!-- ID MLBB Pemain 2 -->
  <div class="mb-3">
    <label class="form-label text-warning fw-bold">ID MLBB Pemain 2 (Server)</label>
    <input type="text" class="form-control bg-dark text-white border-secondary" placeholder="Contoh: 12345678 (1234)" required>
  </div>

  <!-- ID MLBB Pemain 3 -->
  <div class="mb-3">
    <label class="form-label text-warning fw-bold">ID MLBB Pemain 3 (Server)</label>
    <input type="text" class="form-control bg-dark text-white border-secondary" placeholder="Contoh: 12345678 (1234)" required>
  </div>

  <!-- ID MLBB Pemain 4 -->
  <div class="mb-3">
    <label class="form-label text-warning fw-bold">ID MLBB Pemain 4 (Server)</label>
    <input type="text" class="form-control bg-dark text-white border-secondary" placeholder="Contoh: 12345678 (1234)" required>
  </div>

  <!-- ID MLBB Pemain 5 -->
  <div class="mb-3">
    <label class="form-label text-warning fw-bold">ID MLBB Pemain 5 (Server)</label>
    <input type="text" class="form-control bg-dark text-white border-secondary" placeholder="Contoh: 12345678 (1234)" required>
  </div>

  <!-- ID MLBB Cadangan (Opsional) -->
  <div class="mb-3">
    <label class="form-label text-warning fw-bold">ID MLBB Pemain Cadangan (Opsional)</label>
    <input type="text" class="form-control bg-dark text-white border-secondary" placeholder="Contoh: 12345678 (1234)">
  </div>

  <!-- Nomor WhatsApp -->
  <div class="mb-3">
    <label class="form-label text-warning fw-bold">Nomor WhatsApp (Aktif)</label>
    <input type="text" class="form-control bg-dark text-white border-secondary" placeholder="Contoh: 08123456789" required>
  </div>

  <!-- Tombol Submit -->
  <button type="submit" class="btn btn-danger w-100 fw-bold py-2" style="background: linear-gradient(to right, #ff7e5f, #feb47b); border: none;">Kirim Pendaftaran</button>
</form>
