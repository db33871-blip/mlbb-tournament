    <style>
        :root {
            --bg-card: rgba(30, 8, 60, 0.92);
            --accent-yellow: #ffea00;
            --accent-cyan: #00f2fe;
            --accent-pink: #ff007f;
            --text-white: #ffffff;
            --border-glow: rgba(0, 242, 254, 0.5);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

        body {
            background: linear-gradient(180deg, #00b4db 0%, #0083b0 25%, #7b2cbf 60%, #3c096c 85%, #120428 100%);
            background-attachment: fixed;
            color: var(--text-white);
            padding: 15px;
            min-height: 100vh;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        /* MODAL LOGIN */
        #login-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 2, 25, 0.96);
            display: flex !important; justify-content: center; align-items: center;
            z-index: 99999; padding: 20px;
        }

        .modal-box {
            background: var(--bg-card); border: 2px solid var(--accent-yellow); padding: 25px;
            border-radius: 16px; width: 100%; max-width: 380px; text-align: center;
            box-shadow: 0 0 30px rgba(255, 234, 0, 0.5);
        }

        .modal-box h2 { color: var(--accent-yellow); margin-bottom: 12px; text-transform: uppercase; font-size: 1.4rem; }
        .modal-box p { color: #e2e8f0; font-size: 0.9rem; margin-bottom: 20px; }

        .modal-btn { width: 100%; padding: 12px; margin: 8px 0; font-weight: bold; border-radius: 8px; cursor: pointer; border: none; font-size: 1rem; }
        .btn-admin { background: linear-gradient(135deg, #ffea00 0%, #ff9100 100%); color: #120428; }
        .btn-viewer { background: rgba(0, 242, 254, 0.2); color: var(--accent-cyan); border: 1px solid var(--accent-cyan); }

        .panitia-login-box { display: none; margin-top: 15px; }
        .panitia-login-box input {
            width: 100%; padding: 10px; background: rgba(0,0,0,0.7); border: 1px solid var(--border-glow);
            color: #fff; border-radius: 6px; margin-bottom: 10px; text-align: center; font-size: 1rem;
        }

        /* HEADER & NAVBAR */
        .top-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(18, 4, 40, 0.85); padding: 10px 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid var(--border-glow); }
        .role-badge { font-size: 0.85rem; font-weight: bold; padding: 5px 10px; border-radius: 20px; }
        .badge-admin { background: rgba(255, 234, 0, 0.2); color: var(--accent-yellow); border: 1px solid var(--accent-yellow); }
